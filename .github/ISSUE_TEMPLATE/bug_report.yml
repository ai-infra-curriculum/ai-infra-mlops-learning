name: Bug Report
description: Report a bug or error in the curriculum
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this bug affect?
      options:
        - Module 01 - MLOps Foundations
        - Module 02 - CI/CD for ML
        - Module 03 - Model Monitoring
        - Module 04 - Data Quality
        - Module 05 - Experimentation & A/B Testing
        - Module 06 - Automation & Orchestration
        - Module 07 - ML Governance
        - Module 08 - Production Operations
        - Module 09 - MLOps Security
        - Module 10 - Advanced Topics
        - Projects
        - Repository/Infrastructure
      multiple: true

  - type: dropdown
    id: type
    attributes:
      label: Bug Type
      description: What type of issue is this?
      options:
        - Code error (won't run)
        - Technical inaccuracy
        - Broken link or resource
        - Missing dependency
        - Unclear instructions
        - Typo or formatting
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear description of the bug
      placeholder: What's wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to module XX, exercise YY
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: What actually happened? Include error messages if applicable.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14.0, Windows 11]
        - Python version: [e.g., 3.10.5]
        - Key package versions: [e.g., mlflow 2.9.2]
      render: markdown

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or logs
      placeholder: Add any other context about the problem here

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have provided all required information
          required: true

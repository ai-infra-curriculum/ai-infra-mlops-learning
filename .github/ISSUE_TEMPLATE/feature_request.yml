name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "needs-review"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe your idea below.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What area does this feature request relate to?
      options:
        - New exercise
        - New module/topic
        - Existing content improvement
        - New tool/framework
        - Documentation
        - Infrastructure/tooling
        - Other
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Related Module (if applicable)
      description: Which module would this feature enhance?
      options:
        - Module 01 - MLOps Foundations
        - Module 02 - CI/CD for ML
        - Module 03 - Model Monitoring
        - Module 04 - Data Quality
        - Module 05 - Experimentation & A/B Testing
        - Module 06 - Automation & Orchestration
        - Module 07 - ML Governance
        - Module 08 - Production Operations
        - Module 09 - MLOps Security
        - Module 10 - Advanced Topics
        - Projects
        - Repository-wide
      multiple: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve?
      placeholder: Describe the problem or gap this feature would address
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see?
      placeholder: Describe your proposed feature or enhancement
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other solutions have you considered?
      placeholder: Describe alternative approaches

  - type: textarea
    id: value
    attributes:
      label: Learning Value
      description: How would this benefit learners?
      placeholder: |
        - What will learners gain?
        - How does this align with MLOps career requirements?
        - What real-world scenarios does this address?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical (blocking learning)
        - High (important for completeness)
        - Medium (nice to have)
        - Low (future enhancement)
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: Resources
      description: Any relevant links, papers, or examples?
      placeholder: |
        - Links to documentation
        - Example implementations
        - Research papers
        - Industry case studies

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this feature
        - label: I can provide examples or resources
        - label: I can help test this feature

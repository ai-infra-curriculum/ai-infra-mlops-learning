name: Test Exercise Stubs

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'lessons/**/exercises/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'lessons/**/exercises/**'

jobs:
  test-exercise-stubs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - "01-mlops-foundations"
          - "02-cicd-for-ml"
          - "03-model-monitoring"
          - "04-data-quality"
          - "05-experimentation"
          - "06-automation"
          - "07-governance"
          - "08-production-ops"
          - "09-security"
          - "10-advanced-topics"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-timeout

    - name: Test ${{ matrix.module }} exercise stubs
      run: |
        if [ -d "lessons/${{ matrix.module }}/exercises" ]; then
          pytest lessons/${{ matrix.module }}/exercises/ -v --timeout=300
        else
          echo "No exercises directory for ${{ matrix.module }}"
        fi
      continue-on-error: true

  test-all-imports:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test all Python files can be imported
      run: |
        find lessons/ -name "*.py" -type f | while read file; do
          echo "Checking $file"
          python -c "import py_compile; py_compile.compile('$file', doraise=True)"
        done

  validate-exercise-structure:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check exercise README files exist
      run: |
        for module in lessons/*/; do
          if [ -d "$module/exercises" ]; then
            for exercise in $module/exercises/*/; do
              if [ ! -f "$exercise/README.md" ]; then
                echo "Missing README.md in $exercise"
                exit 1
              fi
            done
          fi
        done

    - name: Validate exercise metadata
      run: |
        python -c "
        import os
        import re
        from pathlib import Path

        for readme in Path('lessons').rglob('exercises/*/README.md'):
            content = readme.read_text()

            # Check for required sections
            required = ['Objective', 'Prerequisites', 'Steps', 'Validation']
            for section in required:
                if section not in content:
                    print(f'Missing {section} in {readme}')

            # Check for time estimate
            if 'Duration' not in content and 'Time' not in content:
                print(f'Missing time estimate in {readme}')
        "
      continue-on-error: true

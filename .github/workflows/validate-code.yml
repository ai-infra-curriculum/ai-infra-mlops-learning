name: Validate Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run Black (formatting check)
      run: |
        black --check lessons/ --line-length 88

    - name: Run isort (import sorting check)
      run: |
        isort --check-only lessons/

    - name: Run flake8 (linting)
      run: |
        flake8 lessons/ --max-line-length=88 --extend-ignore=E203,W503

    - name: Run pylint (static analysis)
      run: |
        pylint lessons/ --disable=C0114,C0115,C0116 --max-line-length=88
      continue-on-error: true

    - name: Run mypy (type checking)
      run: |
        mypy lessons/ --ignore-missing-imports
      continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit (security scanning)
      run: |
        bandit -r lessons/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run Safety (dependency vulnerability check)
      run: |
        safety check --json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json

  test-stubs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run pytest on exercise stubs
      run: |
        pytest lessons/ -v --cov=lessons --cov-report=xml --cov-report=html
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/

  validate-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check Markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        config-file: '.github/markdown-link-check-config.json'
      continue-on-error: true

  validate-yaml:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate YAML files
      run: |
        find . -name "*.yml" -o -name "*.yaml" | xargs -I {} python -c "import yaml; yaml.safe_load(open('{}'))"
      continue-on-error: true
